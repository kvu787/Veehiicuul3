; SimplePaint/K12 controls for every car material.
; Values are loaded when the game starts. Colors are sRGB triples in [0, 1].

[SimplePaint]
; BaseColor appears at the facing angle selected by Brightness.
Brightness = 0.1

; 0 is a symmetric paint ramp. Higher values move the highlight sideways.
Shift = 0.0

; Rotation only changes the direction of a nonzero Shift.
RotationDegrees = 0.0

; Facing values are remapped from [0, 1] to [DarkPoint, LightPoint].
DarkPoint = 1.0
LightPoint = 1.0

; Matches K12's front-facing cutoff and keeps back faces numerically stable.
FacingCutoff = 0.01

[BaseColors]
; These defaults are the Car.blend material colors converted to sRGB.
Axles = 0.678429127, 0.678431321, 0.678431321
Body = 0.0002, 0.0002, 0.0002
Cabin = 0.506386429, 0.756053146, 1.000000000
Headlights = 1.000000000, 0.815686771, 0.000000000
Wheels = 0.345097446, 0.345097446, 0.345097446
